<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#050914">

    <meta name="description"
          content="S2N HUB - SECOND TO NONE ESPORTS">

    <title>S2N HUB | SECOND TO NONE</title>

    <link rel="stylesheet"
          href="assets/css/global.css">
</head>

<body>

    <!-- BACKGROUND EFFECTS -->
    <div class="background">
        <div class="grid-background"></div>
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="scan-line"></div>
    </div>

    <!-- NAVBAR -->
    <header class="navbar">

        <a href="index.html" class="nav-brand">
            <span class="brand-mark">S2N</span>
            <span class="brand-name">
                SECOND TO NONE
            </span>
        </a>

        <div class="nav-status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>

    </header>


    <!-- MAIN -->
    <main class="hero">

        <div class="hero-content">

            <!-- LOGO -->
            <div class="logo-stage">

                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="orbit orbit-three"></div>

                <div class="logo-glow"></div>

                <div class="logo-frame">

                    <img
                        src="assets/images/logo/s2n-logo.png"
                        alt="S2N Clan Logo"
                        class="hero-logo"
                        onerror="this.style.display='none';
                        document.getElementById('logo-fallback')
                        .style.display='flex';"
                    >

                    <div id="logo-fallback"
                         class="logo-fallback">
                        S2N
                    </div>

                </div>

            </div>


            <!-- BRAND TEXT -->
            <div class="hero-text">

                <p class="eyebrow">
                    <span></span>
                    PUBG MOBILE ESPORTS CLAN
                    <span></span>
                </p>

                <h1>
                    SECOND
                    <span>TO NONE</span>
                </h1>

                <div class="title-line"></div>

                <p class="hero-description">
                    WE ARE NOT HERE TO FOLLOW.
                    <br>
                    WE ARE HERE TO DOMINATE.
                </p>

                <p class="hero-subtitle">
                    S2N HUB // CLAN & TOURNAMENT SYSTEM
                </p>

            </div>


            <!-- ACTIONS -->
            <div class="hero-actions">

                <a href="login.html"
                   class="btn btn-primary">

                    <span>LOGIN</span>
                    <span class="btn-arrow">→</span>

                </a>

                <a href="register.html"
                   class="btn btn-secondary">

                    <span>JOIN S2N</span>
                    <span class="btn-arrow">↗</span>

                </a>

            </div>


            <!-- BOTTOM INFO -->
            <div class="hero-footer">

                <div class="footer-item">
                    <span class="footer-label">
                        ORGANIZATION
                    </span>

                    <span class="footer-value">
                        SECOND TO NONE
                    </span>
                </div>

                <div class="footer-item">
                    <span class="footer-label">
                        PLATFORM
                    </span>

                    <span class="footer-value">
                        S2N HUB
                    </span>
                </div>

                <div class="footer-item">
                    <span class="footer-label">
                        STATUS
                    </span>

                    <span class="footer-value online">
                        ● ONLINE
                    </span>
                </div>

            </div>

        </div>

    </main>


    <!-- CORNER DECORATION -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>


    <!-- FOOTER -->
    <footer class="site-footer">

        <span>
            © SECOND TO NONE ESPORTS
        </span>

        <span>
            S2N HUB // 2026
        </span>

    </footer>

</body>
</html>
