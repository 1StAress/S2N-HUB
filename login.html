<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080d18">

    <title>S2N HUB | Login</title>

    <link rel="stylesheet"
          href="assets/css/auth.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <!-- CLAN LOGO -->
            <div class="logo-container">
                <img
                    src="assets/images/logo/s2n-logo.png"
                    alt="S2N Clan Logo"
                    class="clan-logo"
                    onerror="this.style.display='none';
                    document.getElementById('logo-placeholder')
                    .style.display='flex';"
                >

                <div id="logo-placeholder"
                     class="logo-placeholder">
                    S2N
                </div>
            </div>

            <!-- BRAND -->
            <div class="brand">
                <h1>SECOND TO NONE</h1>
                <p>S2N HUB MEMBER ACCESS</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form">

                <div class="input-group">
                    <label for="username">
                        USERNAME
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">
                        PASSWORD
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password"
                        >
                            SHOW
                        </button>

                    </div>
                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    LOGIN
                    <span>→</span>
                </button>

                <p id="login-message"
                   class="login-message"
                   aria-live="polite">
                </p>

            </form>

            <!-- REGISTER -->
            <div class="auth-footer">

                <p>
                    NEW PLAYER?
                </p>

                <a href="register.html">
                    CREATE ACCOUNT
                </a>

            </div>

            <!-- FOOTER -->
            <div class="copyright">
                SECOND TO NONE ESPORTS
                <span>© S2N HUB</span>
            </div>

        </section>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
